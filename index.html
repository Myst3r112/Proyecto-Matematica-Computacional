<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>Coonectowski — Detector de comunidades en redes sociales</title>
        <link rel="icon" type="image/png" href="img/Logo_web.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark-frame">
                    <img
                        class="brand-mark"
                        src="img/Logo_web.png"
                        alt=""
                        aria-hidden="true"
                    />
                </span>
                <div class="brand-name">Coonectowski</div>
            </div>
            <img
                class="brand-wordmark"
                src="img/Logo_texto.png"
                alt="Coonectowski"
            />
        </header>

        <main id="app" aria-live="polite"></main>

        <script
            defer
            src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.4/cytoscape.min.js"
        ></script>
        <script
            defer
            src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
        ></script>
        <script
            defer
            src="https://unpkg.com/lenis@1.1.20/dist/lenis.min.js"
        ></script>
        <script defer src="graph.js"></script>
        <script defer src="script.js"></script>
    </body>
</html>
